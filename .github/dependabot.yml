version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # release.yml is generated by cargo-dist, which still emits checkout@v6.
      # A hand-bumped v7 makes `dist plan` fail until dist itself moves to v7.
      - dependency-name: actions/checkout
        update-types: ["version-update:semver-major"]
