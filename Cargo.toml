[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/mmgalushka/dps150"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
device = { path = "crates/device" }
app = { path = "crates/app" }
ui = { path = "crates/ui" }

[package]
name = "dps150"
description = "Terminal interface for FNIRSI DPS-150"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/mmgalushka/dps150"
publish = false

[package.metadata.dist]
dist = true

[dependencies]
app.workspace = true
device.workspace = true
ui.workspace = true
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serialport = "4.10.1"
signal-hook = "0.4.6"

[dev-dependencies]
serialport = "4.10.1"
device.workspace = true
libc = "0.2"
vt100 = "0.18.1"

[package.metadata.deb]
maintainer = "Mykola Galushka <mm.galushka@gmail.com>"
section = "electronics"
priority = "optional"
depends = "$auto"
extended-description = "Terminal interface for the FNIRSI DPS-150 bench power supply."
maintainer-scripts = "packaging/"
assets = [
    ["target/release/dps150", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/dps150/README", "644"],
]

# Profile used by cargo-dist for release builds (DEVOPS.md §5).
[profile.dist]
inherits = "release"
lto = "thin"
