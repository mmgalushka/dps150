[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/mmgalushka/dps150"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
device = { path = "crates/device" }
app = { path = "crates/app" }
ui = { path = "crates/ui" }

[package]
name = "dps150"
description = "Terminal interface for FNIRSI DPS-150"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
ui.workspace = true

[dev-dependencies]
serialport = "4.10.1"
